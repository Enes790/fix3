<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
<title>KUTU SAVAŞI</title>
<!-- CSS ayrı dosyada -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Ana oyun tuvali -->
<canvas id="gameCanvas"></canvas>

<!-- Boss öncesi kırmızı uyarı ekranı -->
<div id="warningOverlay"></div>

<!-- Üst diyalog: bot yüzü + konuşma balonu -->
<div id="dialogArea">
    <div id="botFace">🖥️</div>
    <div id="speechBubble">...</div>
</div>

<!-- Sol üst can, sağ üst skor, ortada dalga -->
<div id="healthBar"></div>
<div id="scoreDisplay">SKOR: 0</div>
<div id="waveDisplay">DALGA: 1/3</div>

<!-- Mobil joystick -->
<div id="joystick"><div id="joystickKnob"></div></div>

<!-- Ulti butonu -->
<div id="ultiButton">ULTI<span class="ultiText" id="ultiText">0%</span></div>

<!-- Başlat butonu -->
<button id="startButton">BAŞLA</button>

<!-- Oyun sonu ekranı -->
<div id="gameOverScreen">
    <h1 id="gameOverTitle">OYUN BİTTİ</h1>
    <p id="gameOverDesc"></p>
    <p id="gameOverScore"></p>
    <p id="gameOverRecord"></p>
    <p id="gameOverStats"></p>
    <button id="restartButton">TEKRAR OYNA</button>
</div>

<!-- İngilizce soru ekranı -->
<div id="questionScreen">
    <div id="questionTense">PRESENT SIMPLE</div>
    <div id="questionText">Loading...</div>
    <div id="answerGrid">
        <div class="answerBtn" data-index="0">A</div>
        <div class="answerBtn" data-index="1">B</div>
        <div class="answerBtn" data-index="2">C</div>
        <div class="answerBtn" data-index="3">D</div>
    </div>
    <div id="feedbackText"></div>
</div>

<!-- ============================================================ -->
<!-- DEBUG: Yükleme takibi için yüklenen dosyaları tutan array -->
<!-- ============================================================ -->
<script>
    window.yuklenenDosyalar = [];
    console.log("═══════════════════════════════════");
    console.log("KUTU SAVAŞI - Yükleme Başlıyor");
    console.log("═══════════════════════════════════");
</script>

<!-- ============================================================ -->
<!-- YÜKLEME SIRASI ÖNEMLİ! -->
<!-- config → utils → questions → input → ui → player → bot → boss → bullet → game -->
<!-- ============================================================ -->
<script src="config.js"></script>
<script src="utils.js"></script>
<script src="questions.js"></script>
<script src="input.js"></script>
<script src="ui.js"></script>
<script src="player.js"></script>
<script src="bot.js"></script>
<script src="boss.js"></script>
<script src="bullet.js"></script>
<script src="game.js"></script>

<!-- ============================================================ -->
<!-- YÜKLEME KONTROLÜ - Tüm dosyalar yüklendi mi? -->
<!-- ============================================================ -->
<script>
    const BEKLENEN_DOSYALAR = ['config','utils','questions','input','ui','player','bot','boss','bullet','game'];
    const EKSIK_DOSYALAR = BEKLENEN_DOSYALAR.filter(d => !window.yuklenenDosyalar.includes(d));
    
    console.log("═══════════════════════════════════");
    if (EKSIK_DOSYALAR.length === 0) {
        console.log("✓ TÜM DOSYALAR YÜKLENDİ (" + window.yuklenenDosyalar.length + "/10)");
    } else {
        console.error("✗ EKSİK DOSYALAR: " + EKSIK_DOSYALAR.join(", "));
    }
    console.log("═══════════════════════════════════");
</script>

</body>
</html>
