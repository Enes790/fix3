<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
<title>İngilizce Soru Bankası</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============================================================ -->
<!-- YÜKLEME PANELİ -->
<!-- ============================================================ -->
<div id="yuklemePaneli">
    <h2>📚 Sistem Başlatılıyor</h2>
    <div id="yuklemeListesi"></div>
    <div id="yuklemeDurum">Yükleniyor...</div>
</div>

<!-- ============================================================ -->
<!-- OYUN ALANI -->
<!-- ============================================================ -->
<div id="oyunAlani" style="display:none;">

    <canvas id="gameCanvas"></canvas>

    <div id="warningOverlay"></div>

    <div id="dialogArea">
        <div id="botFace">🖥️</div>
        <div id="speechBubble">...</div>
    </div>

    <div id="healthBar"></div>
    <div id="scoreDisplay">SKOR: 0</div>
    <div id="waveDisplay">DALGA: 1/3</div>

    <div id="joystick"><div id="joystickKnob"></div></div>

    <div id="ultiButton">ULTI<span class="ultiText" id="ultiText">0%</span></div>

    <button id="startButton">BAŞLA</button>

    <div id="gameOverScreen">
        <h1 id="gameOverTitle">OYUN BİTTİ</h1>
        <p id="gameOverDesc"></p>
        <p id="gameOverScore"></p>
        <p id="gameOverRecord"></p>
        <p id="gameOverStats"></p>
        <button id="restartButton">TEKRAR OYNA</button>
    </div>

    <div id="questionScreen">
        <div id="questionTense">PRESENT SIMPLE</div>
        <div id="questionText">Loading...</div>
        <div id="answerGrid">
            <div class="answerBtn" data-index="0">A</div>
            <div class="answerBtn" data-index="1">B</div>
            <div class="answerBtn" data-index="2">C</div>
            <div class="answerBtn" data-index="3">D</div>
        </div>
        <div id="feedbackText"></div>
    </div>

</div>

<!-- ============================================================ -->
<!-- KALICI DEBUG PANELİ - Alt tarafta, her zaman görünür -->
<!-- ============================================================ -->
<div id="kaliciDebug"></div>

<!-- ============================================================ -->
<!-- YÜKLEME TAKİP SİSTEMİ -->
<!-- ============================================================ -->
<script>
    window.yuklenenDosyalar = [];
    window.beklenenDosyalar = [
        'config', 'utils', 'questions', 'input', 'ui',
        'player', 'bot', 'boss', 'bullet', 'game'
    ];

    window.dosyaYuklendi = function(ad) {
        window.yuklenenDosyalar.push(ad);
        console.log("[✓] " + ad + ".js yüklendi");
        const liste = document.getElementById('yuklemeListesi');
        if (liste) {
            const satir = document.createElement('div');
            satir.className = 'yuklemeSatir';
            satir.textContent = '[✓] ' + ad + '.js yüklendi';
            liste.appendChild(satir);
        }
    };

    window.yuklemeKontrol = function() {
        const eksikler = window.beklenenDosyalar.filter(d => !window.yuklenenDosyalar.includes(d));
        const durum = document.getElementById('yuklemeDurum');

        if (eksikler.length === 0) {
            if (durum) {
                durum.textContent = '✓ Tüm dosyalar yüklendi!';
                durum.style.color = '#2ecc71';
            }
            console.log("✓ Tüm dosyalar yüklendi");
            setTimeout(() => {
                document.getElementById('yuklemePaneli').style.display = 'none';
                document.getElementById('oyunAlani').style.display = 'block';
                if (typeof resizeCanvas === 'function') resizeCanvas();
            }, 500);
        } else {
            if (durum) {
                durum.innerHTML = '✗ Eksik dosyalar:<br>' + eksikler.join(', ');
                durum.style.color = '#e74c3c';
            }
            console.error("Eksik dosyalar:", eksikler);
        }
    };

    console.log("═══════════════════════════════════");
    console.log("Yükleme başlıyor...");
    console.log("═══════════════════════════════════");
</script>

<!-- ============================================================ -->
<!-- DOSYALARI YÜKLE (sıra önemli) -->
<!-- ============================================================ -->
<script src="config.js"></script>
<script src="utils.js"></script>
<script src="questions.js"></script>
<script src="input.js"></script>
<script src="ui.js"></script>
<script src="player.js"></script>
<script src="bot.js"></script>
<script src="boss.js"></script>
<script src="bullet.js"></script>
<script src="game.js"></script>

<!-- ============================================================ -->
<!-- SON KONTROL -->
<!-- ============================================================ -->
<script>
    window.yuklemeKontrol();
</script>

<!-- ============================================================ -->
<!-- KALICI DEBUG - Her 500ms'de alt panelde durum günceller -->
<!-- ============================================================ -->
<script>
    // Hataları yakala ve panele yaz
    window.hataMesaji = '';
    window.addEventListener('error', (e) => {
        window.hataMesaji = '❌ HATA: ' + (e.filename || '?').split('/').pop() + ':' + e.lineno + ' — ' + e.message;
    });

    // Her 500ms'de paneli güncelle
    setInterval(() => {
        const el = document.getElementById('kaliciDebug');
        if (!el) return;

        let s = '═══ DEBUG ═══\n';
        try { s += 'Yüklenen: ' + window.yuklenenDosyalar.length + '/10 [' + window.yuklenenDosyalar.join(',') + ']\n'; } catch(e) {}
        try { s += 'canvas: ' + canvas.width + 'x' + canvas.height + '\n'; } catch(e) { s += 'canvas: YOK\n'; }
        try { s += 'arena: x=' + Math.round(arena.x) + ' y=' + Math.round(arena.y) + ' w=' + Math.round(arena.w) + ' h=' + Math.round(arena.h) + '\n'; } catch(e) { s += 'arena: YOK\n'; }
        try { s += 'player: x=' + Math.round(player.x) + ' y=' + Math.round(player.y) + ' r=' + player.radius + ' hp=' + player.hp + '/' + player.maxHp + '\n'; } catch(e) { s += 'player: YOK\n'; }
        try { s += 'gameState: ' + gameState.state + ' | running=' + gameState.isRunning + '\n'; } catch(e) { s += 'gameState: YOK\n'; }
        try { s += 'botEnemies: ' + botEnemies.length + '\n'; } catch(e) { s += 'botEnemies: YOK\n'; }
        try { s += 'ctx: ' + (typeof ctx) + '\n'; } catch(e) {}
        try { s += 'roundRect: ' + (typeof ctx.roundRect) + '\n'; } catch(e) {}
        try { s += 'oyunAlani: ' + document.getElementById('oyunAlani').style.display + '\n'; } catch(e) {}

        if (window.hataMesaji) {
            s += '\n' + window.hataMesaji;
            el.style.background = 'rgba(180, 0, 0, 0.9)';
            el.style.color = '#fff';
        } else {
            el.style.background = 'rgba(0, 0, 0, 0.85)';
            el.style.color = '#0f0';
        }

        el.textContent = s;
    }, 500);
</script>

</body>
</html>
